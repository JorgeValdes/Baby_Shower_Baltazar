<style>
:root{--bg:#f6f7f1;--card:#f5f6f0;--green:#5f7a58;--soft:#a9bc9f;--text:#4d5f48;--line:#c9d3c0;--sand:#d9b98a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Quicksand,system-ui,sans-serif;display:flex;justify-content:center;padding:20px 12px}
.card{position:relative;width:100%;max-width:480px;background:#f5f6f0;border:1px solid var(--line);border-radius:6px;padding:28px 24px 36px;overflow:hidden;text-align:center}
.card:before{content:"";z-index:2;position:absolute;inset:10px;border:1px solid var(--line);border-radius:4px;pointer-events:none}
.cloud{position:absolute;width:110px;height:44px;background:var(--line);opacity:.45;border-radius:40px}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:50px;height:50px;left:16px;top:-24px}.cloud:after{width:40px;height:40px;left:56px;top:-16px}
.c1{right:-20px;top:30px}.c2{left:-30px;top:340px}
.hero{display:flex;align-items:center;margin:-28px -24px 0;text-align:center}
.balloon{width:46%;flex:none;display:block;mix-blend-mode:multiply;align-self:flex-start;position:relative;z-index:1}
.titles{flex:1;padding:0 18px 0 4px}
.pre{font-family:Caveat,cursive;font-size:1.25rem;margin:0}
h1{font-family:'Dancing Script',cursive;font-weight:700;color:var(--green);font-size:2.2rem;line-height:1;margin:4px 0}
.name{font-family:'Dancing Script',cursive;font-weight:700;color:var(--green);font-size:3.7rem;line-height:1;margin:0 0 4px}
.orn{display:block;margin:6px auto 20px;width:150px}
.info{max-width:300px;margin:0 auto;text-align:left}
.row{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row svg{flex:none;width:38px;height:38px;stroke:var(--green);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row small{display:block;font-size:1.05rem;font-weight:500}
.row b{display:block;font-weight:500;font-size:1.15rem;color:var(--green)}
.row span{font-size:.95rem}
.map{display:inline-block;margin-top:6px;font-size:.9rem;font-weight:600;color:var(--green);text-decoration:underline;text-underline-offset:3px}
.msg{font-family:Caveat,cursive;font-size:1.55rem;line-height:1.3;margin:22px auto 8px;max-width:340px}
.btn{display:inline-block;margin-top:12px;background:var(--green);color:var(--card);font:600 1.05rem Quicksand,sans-serif;padding:13px 30px;border-radius:30px;text-decoration:none}
.btn:focus-visible,.map:focus-visible{outline:3px solid var(--sand);outline-offset:3px}
.leaf{position:absolute;bottom:-6px;width:90px;opacity:.8}.l1{left:-8px}.l2{right:-8px;transform:scaleX(-1)}
@media (max-width:380px){.name{font-size:3rem}h1{font-size:1.8rem}.pre{font-size:1.05rem}}
</style>
</head>
